
name: Permanent Linux SSH Server Via Bore

on:
  schedule:
    - cron: '0 */6 * * *'  # روشن شدن خودکار هر ۶ ساعت یک‌بار (۲۴/۷)
  workflow_dispatch:        # استارت دستی با دکمه Run

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: "PRE-RUN: Restore Persistent Workspace"
        uses: actions/cache@v4
        with:
          path: /home/cynetadmin/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      - name: ALL
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sudo useradd -m -s /bin/bash cynetadmin || true
          echo "cynetadmin:Cynet@2026" | sudo chpasswd
          sudo usermod -aG sudo cynetadmin
          echo "cynetadmin ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/cynetadmin
          sudo mkdir -p /home/cynetadmin/workspace
          sudo chown -R cynetadmin:cynetadmin /home/cynetadmin/workspace
          set -e
          echo "Fetching latest bore release info..."
          RELEASE_JSON=$(curl -s https://api.github.com/repos/ekzhang/bore/releases/latest)

          ASSET_URL=$(echo "$RELEASE_JSON" | grep -oE '"browser_download_url": *"[^"]*x86_64-unknown-linux-musl\.tar\.gz"' | head -1 | sed -E 's/"browser_download_url": *"([^"]*)"/\1/')

          if [ -z "$ASSET_URL" ]; then
            echo "Could not find a matching Linux asset. Full release JSON:"
            echo "$RELEASE_JSON"
            exit 1
          fi

          echo "Downloading: $ASSET_URL"
          curl -L -o bore.tar.gz "$ASSET_URL"
          tar -xzf bore.tar.gz
          chmod +x bore
          ./bore --version
          ./bore local 8080 --to bore.pub > bore.log 2>&1 &

          echo "Waiting for tunnel to establish..."
          REMOTE_PORT=""
          for i in $(seq 1 30); do
            sleep 1
            if grep -qoE 'remote_port=[0-9]+' bore.log 2>/dev/null; then
              REMOTE_PORT=$(grep -oE 'remote_port=[0-9]+' bore.log | head -1 | cut -d= -f2)
              break
            fi
            if grep -qoE 'listening at bore\.pub:[0-9]+' bore.log 2>/dev/null; then
              REMOTE_PORT=$(grep -oE 'listening at bore\.pub:[0-9]+' bore.log | head -1 | grep -oE '[0-9]+$')
              break
            fi
          done

          if [ -z "$REMOTE_PORT" ]; then
            echo "Failed to get tunnel port. Log:"
            cat bore.log
            exit 1
          fi

          URL="bore.pub:$REMOTE_PORT"
          echo "=================================================="
          echo "  >>> PERMANENT LINUX SSH SERVER IS LIVE! <<<"
          echo "  Tailscale IP  : $URL"
          echo "  Username      : cynetadmin"
          echo "  Password      : Cynet@2026"
          echo "  ------------------------------------------------"
          echo "  💻 Connect via Terminal / CMD:"
          echo "  >> ssh -p $REMOTE_PORT cynetadmin@bore.pub"
          echo "  ------------------------------------------------"
          echo "  💾 Persistent Folder : /home/cynetadmin/workspace"
          echo "=================================================="
          for i in {1..355}; do
            sleep 60
            echo "[$i/355] Linux SSH Server is active..."
          done

      # ذخیره خودکار فایل‌های پوشه دائمی قبل از ری‌استارت
      - name: "POST-RUN: Save Workspace to Cloud"
        uses: actions/cache@v4
        if: always()
        with:
          path: /home/cynetadmin/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
